<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <script>var _DLV='10';if(localStorage.getItem('dlVersion')!==_DLV){localStorage.removeItem('dlDone');}if(!localStorage.getItem('dlDone')&&!sessionStorage.getItem('acPassed')){location.replace('accueil.html');}</script>
    <title>Le Sentier de Sillans</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="map.css">
</head>
<body>
    <script src="splash.js"></script>

    <header class="header">
        <div class="header-logo">
            <img src="images/logo.svg" alt="Le sentier de Sillans" class="logo-img">
        </div>
        <div class="header-weather">
            <svg id="weatherIcon" class="weather-icon" viewBox="0 0 48 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="30" cy="14" r="9" fill="white" opacity="0.9"/>
                <path d="M30 5 L30 2M30 23 L30 26M39 14 L42 14M21 14 L18 14M36.4 8.6 L38.5 6.5M23.6 19.4 L21.5 21.5M36.4 19.4 L38.5 21.5M23.6 8.6 L21.5 6.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                <rect x="6" y="20" width="28" height="14" rx="7" fill="white"/>
                <rect x="12" y="14" width="16" height="12" rx="6" fill="white"/>
            </svg>
            <span id="weatherText" class="weather-text">Couvert • 25°C</span>
        </div>
    </header>

    <main class="main-content">
        <div class="poi-notif" id="poiNotif"></div>
        <div class="map-container" id="mapContainer">
            <img src="images/carte.png" alt="Carte du sentier de Sillans" class="map-image" id="mapImage" draggable="false">

            <!-- Panneau droit : téléchargement + interdictions -->
            <div class="prohib-panel">

                <!-- Téléchargement -->
                <div class="prohib-item" id="dlWidget">
                    <button class="dl-icon-btn" id="dlTriggerBtn" aria-label="Télécharger les données">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                            <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <div class="dl-content">
                        <div id="dlStateInit">
                            <p class="dl-panel-title">TÉLÉCHARGER LES DONNÉES<br>POUR UNE MEILLEURE NAVIGATION</p>
                            <div class="dl-panel-choices">
                                <button class="dl-btn-ok" id="dlBtnOk">D'ACCORD</button>
                                <button class="dl-btn-no" id="dlBtnNo">NON MERCI</button>
                            </div>
                        </div>
                        <div id="dlStateProgress" class="dl-hidden">
                            <p class="dl-panel-sub">Téléchargement en cours.</p>
                            <div class="dl-progress-track">
                                <div class="dl-progress-fill" id="dlProgressFill"></div>
                            </div>
                        </div>
                        <div id="dlStateDone" class="dl-hidden">
                            <p class="dl-panel-sub">Téléchargement fini.</p>
                            <svg class="dl-check-svg" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="20" cy="20" r="18" fill="#03658C"/>
                                <polyline points="11,20 17,27 29,12" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Baignade interdite -->
                <button class="prohib-item" id="prohibBtn1" aria-label="Baignade interdite">
                    <div class="prohib-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="14" cy="4" r="2" fill="#1A87AC"/>
                            <path d="M3 11l4 1.5 4-5 4.5 2" stroke="#1A87AC" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 17c1.5-1.2 3-1.2 4.5 0s3 1.2 4.5 0 3-1.2 4.5 0 3 1.2 4.5 0" stroke="#1A87AC" stroke-width="2.4" stroke-linecap="round"/>
                            <path d="M2 21c1.5-1.2 3-1.2 4.5 0s3 1.2 4.5 0 3-1.2 4.5 0 3 1.2 4.5 0" stroke="#1A87AC" stroke-width="2.4" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="prohib-body">
                        <span class="prohib-title">Baignade interdite</span>
                        <span class="prohib-desc">Cours d'eau protégé</span>
                    </div>
                </button>

                <!-- Feu et cigarettes interdits -->
                <button class="prohib-item" id="prohibBtn2" aria-label="Fumer et faire du feu sont interdits">
                    <div class="prohib-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z" stroke="#C67C24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="prohib-body">
                        <span class="prohib-title">Feu interdit</span>
                        <span class="prohib-desc">Risque d'incendie de forêt</span>
                    </div>
                </button>

            </div>
        </div>

        <div class="poi-banner" id="poiBanner">
            <div class="poi-banner-inner" id="poiBannerInner">
                <h2 class="poi-banner-title" id="poiBannerTitle"></h2>
                <div class="poi-banner-divider"></div>
                <div class="poi-banner-body">
                    <p class="poi-banner-desc" id="poiBannerDesc"></p>
                    <div class="poi-banner-thumb" id="poiBannerThumb"></div>
                </div>
                <div class="poi-banner-actions">
                    <button class="poi-banner-btn-primary" id="btnPoiSavoirPlus">En savoir plus</button>
                    <button class="poi-banner-btn-secondary" id="btnPoiValider">VALIDER L'ÉTAPE</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <button class="footer-btn" aria-label="Informations" onclick="window.goTo('info.html')">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="#1a6b8a" stroke-width="2"/>
                <path d="M12 11 L12 17" stroke="#1a6b8a" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="12" cy="7.5" r="1.2" fill="#1a6b8a"/>
            </svg>
        </button>

        <div class="footer-center">
            <button class="footer-map-btn" aria-label="Carte">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="white"/>
                    <circle cx="12" cy="9" r="2.5" fill="#1a6b8a"/>
                </svg>
            </button>
        </div>

        <button class="footer-btn" aria-label="Statistiques" onclick="window.goTo('stats.html')">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="13" width="3.5" height="7" rx="1" fill="#1a6b8a"/>
                <rect x="10.25" y="8" width="3.5" height="12" rx="1" fill="#1a6b8a"/>
                <rect x="16.5" y="4" width="3.5" height="16" rx="1" fill="#1a6b8a"/>
            </svg>
        </button>
    </footer>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-modal">
            <p class="confirm-question">Souhaitez-vous vraiment annuler la validation de cette étape&nbsp;?</p>
            <p class="confirm-warning">Annuler la validation d'une étape entraînera également l'annulation de toutes les étapes suivantes.</p>
            <div class="confirm-actions">
                <button class="confirm-btn-cancel" id="confirmCancel">Annuler</button>
                <button class="confirm-btn-confirm" id="confirmOk">Confirmer</button>
            </div>
        </div>
    </div>

    <script src="transitions.js"></script>
    <script src="weather.js"></script>
    <script src="data.js"></script>
    <script src="map.js"></script>
    <script src="download.js"></script>
</body>
</html>
