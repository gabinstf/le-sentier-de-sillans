<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Point d'intérêt — Le Sentier de Sillans</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="interet.css">
</head>
<body>

    <header class="header">
        <div class="header-logo">
            <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="18" stroke="white" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
            </svg>
            <span class="logo-text">Le sentier<br>de Sillans</span>
        </div>
        <div class="header-weather">
            <svg id="weatherIcon" class="weather-icon" viewBox="0 0 48 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="30" cy="14" r="9" fill="white" opacity="0.9"/>
                <path d="M30 5 L30 2M30 23 L30 26M39 14 L42 14M21 14 L18 14M36.4 8.6 L38.5 6.5M23.6 19.4 L21.5 21.5M36.4 19.4 L38.5 21.5M23.6 8.6 L21.5 6.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                <rect x="6" y="20" width="28" height="14" rx="7" fill="white"/>
                <rect x="12" y="14" width="16" height="12" rx="6" fill="white"/>
            </svg>
            <span id="weatherText" class="weather-text">Couvert • 25°C</span>
        </div>
    </header>

    <main class="main-content">

        <div class="gallery-wrapper" id="galleryWrapper">
<div class="gallery-counter" id="galleryCounter">1 / 1</div>
            <div class="gallery-track" id="galleryTrack"></div>
            <div class="gallery-dots" id="galleryDots"></div>
        </div>

        <div class="poi-nav">
            <button class="poi-nav-btn" id="btnPrev">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M15 18l-6-6 6-6" stroke="#48ADCC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Précédent
            </button>
            <span class="poi-nav-count" id="poiNavCount"></span>
            <button class="poi-nav-btn" id="btnNext">
                Suivant
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M9 18l6-6-6-6" stroke="#48ADCC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div class="poi-content" id="poiContent"></div>

    </main>

    <footer class="footer">
        <button class="footer-btn" aria-label="Informations">
            <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#1a6b8a" stroke-width="2"/>
                <path d="M12 11 L12 17" stroke="#1a6b8a" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="12" cy="7.5" r="1.2" fill="#1a6b8a"/>
            </svg>
        </button>
        <div class="footer-center">
            <button class="footer-map-btn" aria-label="Carte" onclick="window.location.href='index.html'">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="white"/>
                    <circle cx="12" cy="9" r="2.5" fill="#1a6b8a"/>
                </svg>
            </button>
        </div>
        <button class="footer-btn" aria-label="Profil">
            <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" stroke="#1a6b8a" stroke-width="2"/>
                <path d="M4 20c0-4 3.58-7 8-7s8 3 8 7" stroke="#1a6b8a" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
    </footer>

    <script src="weather.js"></script>
    <script src="interet.js"></script>

</body>
</html>
